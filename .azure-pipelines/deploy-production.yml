trigger:
  branches:
    exclude:
      - '*'
  tags:
    include:
      - 'v*'

pr: none

parameters:
  - name: runBuildAndDeploy
    displayName: 'Executar Build e Deploy do Frontend'
    type: boolean
    default: true

variables:
  - name: nodeVersion
    value: '22.x'
  - name: DEPLOY_DIR
    value: '/var/www/imperial-mart.com'

pool:
  vmImage: 'ubuntu-latest'

stages:
  # ============================================================================
  # STAGE 1: BUILD & PACKAGE
  # ============================================================================
  - stage: Build
    displayName: 'Build Frontend UI'
    condition: and(succeeded(), eq('${{ parameters.runBuildAndDeploy }}', 'true'))
    jobs:
      - job: BuildApp
        displayName: 'Compile Monorepo & Bundle UI'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)
            displayName: 'Install Node.js $(nodeVersion)'

          - script: |
              echo "📦 Instalando dependências..."
              npm ci || npm install
            displayName: 'Install Dependencies'

          - script: |
              echo "🏗️ Gerando build do frontend..."
              npm run build
            displayName: 'Build Application'

          - script: |
              echo "📦 Empacotando artefatos de distribuição..."
              mkdir -p $(Build.ArtifactStagingDirectory)/package
              tar -czf $(Build.ArtifactStagingDirectory)/package/dist-$(Build.BuildId).tar.gz -C apps/ui/dist .
            displayName: 'Package Distribution Bundle'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/package'
              artifact: 'deployment-package-ui'
              publishLocation: 'pipeline'
            displayName: 'Publish UI Artifact'

  # ============================================================================
  # STAGE 2: DEPLOY APPLICATION CODE TO VPS
  # ============================================================================
  - stage: DeployApp
    displayName: 'Deploy Code to VPS'
    dependsOn: Build
    condition: and(succeeded(), eq('${{ parameters.runBuildAndDeploy }}', 'true'))
    jobs:
      - deployment: DeployAppJob
        displayName: 'Deploy Application Code'
        environment: 'PRODUCTION'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'deployment-package-ui'
                  displayName: 'Download Deployment Package'

                - task: SSH@0
                  displayName: 'Deploy Bundle to Web Directory'
                  inputs:
                    sshEndpoint: 'DESKTOP'
                    runOptions: 'inline'
                    inline: |
                      set -euo pipefail
                      echo "📁 Verificando diretório de destino: $(DEPLOY_DIR)..."
                      mkdir -p $(DEPLOY_DIR)
                      cd $(DEPLOY_DIR)

                      if [ "$(pwd)" != "$(DEPLOY_DIR)" ]; then
                        echo "❌ Diretório incorreto, abortando!"
                        exit 1
                      fi

                      echo "🧹 Limpando arquivos anteriores (preservando .htaccess)..."
                      find . -maxdepth 1 ! -name '.' ! -name '.htaccess' -exec rm -rf {} +
                    readyTimeout: '20000'

                - script: |
                    set -euo pipefail
                    echo "📦 Extraindo pacote no diretório de destino temporário local antes do envio..."
                    tar -xzf $(Pipeline.Workspace)/deployment-package-ui/dist-$(Build.BuildId).tar.gz -C $(Pipeline.Workspace)/deployment-package-ui
                    rm $(Pipeline.Workspace)/deployment-package-ui/dist-$(Build.BuildId).tar.gz
                  displayName: 'Unpack Distribution for SSH Sync'

                - task: CopyFilesOverSSH@0
                  displayName: 'Copy Files to Web Server'
                  inputs:
                    sshEndpoint: 'DESKTOP'
                    sourceFolder: '$(Pipeline.Workspace)/deployment-package-ui'
                    contents: '**'
                    targetFolder: '$(DEPLOY_DIR)'
                    flattenFolders: false
                    readyTimeout: '20000'
